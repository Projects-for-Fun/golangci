# golangci-lint v2 configuration format.
# Validate with: golangci-lint config verify
version: "2"

run:
  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 5m
  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1
  # include test files or not, default is true
  tests: true

linters:
  default: none
  enable:
    # Style checkers
    - misspell
    - nestif # deeply nested if statements
    - wastedassign # finds wasted assignment statements

    # Bug finders
    - asciicheck
    - bodyclose # HTTP response body is closed successfully
    - errcheck # unchecked errors
    - govet # suspicious constructs
    - ineffassign # assignments to existing variables are not used
    - unparam # reports unused function parameters
    - unused # unused constants, variables, functions and types
    - staticcheck # replaces deprecated stylecheck + gosimple

    # New since the v1 config: useful for an API project
    - errorlint # proper error wrapping / Is / As handling
    - noctx # HTTP requests without context
    - copyloopvar # redundant loop variable copies (Go 1.22+)
    - intrange # prefer range-over-int loops
    - revive # replacement for archived errname; only naming rules enabled below
    - sqlclosecheck # sql.Rows/Stmt/Conn are closed
    - rowserrcheck # Err of rows is checked

  settings:
    staticcheck:
      # STxxxx checks: https://staticcheck.io/docs/checks/
      # Was stylecheck.settings in v1; carry over the opinionated defaults.
      checks:
        - all
        - -ST1000 # package comments
    govet:
      # v1's check-shadowing: true moved here.
      enable:
        - shadow
    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      check-type-assertions: true
      # Report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`.
      check-blank: true
    misspell:
      locale: US
    revive:
      # Scoped replacement for the archived errname linter.
      rules:
        - name: error-naming # sentinel errors must be named ErrFoo
        - name: error-strings # error strings: lowercase, no punctuation

  exclusions:
    # v2: path and linter exclusions live here instead of `issues.exclude-rules`.
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Maximum issues count per one linter. Set to 0 to disable.
  max-issues-per-linter: 0
  # Maximum count of issues with the same text. Set to 0 to disable.
  max-same-issues: 1
  # Fix found issues (if supported by the linter).
  fix: false
